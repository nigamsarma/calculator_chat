<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  input, button { font: inherit; padding: 8px; margin: 4px 0; box-sizing: border-box; }
  input { width: 100%; }
  button { width: 100%; cursor: pointer; }
  #status { font-size: 14px; color: #666; }
  #log { margin-top: 12px; }
  #log div { padding: 8px; border-bottom: 1px solid #ddd; }
  #log .me { color: #555; text-align: right; }
</style>
</head>
<body>
  <h3>Chat</h3>
  <div id="status">Connecting…</div>
  <!-- Local test: ws://localhost:8787   After deploy: wss://relay.YOURNAME.workers.dev -->
  <input id="url" value="wss://relay.snigamanandhasarma.workers.dev" aria-label="Server URL">
  <input id="room" value="abc123" aria-label="Room (letters, numbers, - and _)">
  <button id="connect">Connect</button>
  <input id="text" placeholder="Type a message" aria-label="Message">
  <button id="send" disabled>Send</button>
  <div id="log"></div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws, retry = 0, timer;

  function addLine(text, cls) {
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = text;                     // textContent avoids HTML injection
    $('log').prepend(line);
  }

  function connect() {
    clearTimeout(timer);
    if (ws) { ws.onclose = null; ws.close(); }
    const base = $('url').value.trim().replace(/\/+$/, '');
    const room = $('room').value.trim();
    $('status').textContent = 'Connecting…';
    ws = new WebSocket(base + '/room/' + encodeURIComponent(room));

    ws.onopen = () => {
      retry = 0;
      $('status').textContent = 'Connected to room "' + room + '"';
      $('send').disabled = false;
    };
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'msg') addLine(msg.text, 'them');
    };
    ws.onclose = () => {
      $('send').disabled = true;
      const wait = Math.min(1000 * 2 ** retry++, 15000);
      $('status').textContent = 'Disconnected. Retrying in ' + wait / 1000 + 's…';
      timer = setTimeout(connect, wait);
    };
    ws.onerror = () => ws.close();
  }

  function send() {
    const text = $('text').value.trim();
    if (!text || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ type: 'msg', text }));
    addLine('You: ' + text, 'me');
    $('text').value = '';
    $('text').focus();
  }

  $('connect').onclick = connect;
  $('send').onclick = send;
  $('text').onkeydown = (e) => { if (e.key === 'Enter') send(); };
  connect();
</script>
</body>
</html>
